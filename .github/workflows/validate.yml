name: validate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: cd backend && npm install && npm test
      - run: docker build -t iptvwebos-backend ./backend
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install webOS CLI
        run: npm install -g @webos-tools/cli
      - name: Package webOS app
        run: |
          rm -rf tv-package dist && mkdir -p tv-package/js tv-package/css dist
          cp appinfo.json index.html tv-package/
          cp js/*.js tv-package/js/
          cp css/*.css tv-package/css/
          python3 - <<'PY'
          import struct,zlib
          w=h=80
          raw=b''.join(b'\\x00'+bytes([10,22,39,255])*w for _ in range(h))
          def ch(t,d):
              return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          png=b'\\x89PNG\\r\\n\\x1a\\n'+ch(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+ch(b'IDAT',zlib.compress(raw))+ch(b'IEND',b'')
          open('tv-package/icon.png','wb').write(png)
          PY
          ares-package tv-package --outdir dist --no-minify
      - uses: actions/upload-artifact@v4
        with:
          name: iptvwebos-ipk
          path: dist/*.ipk
